[project]
name = "rastro-saida"
version = "0.0.0"
description = "Rastro — módulo saida: Assinaturas por filtro e limiar; disparo de alerta com entrega única por assinante."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rastro_saida"]
