[project]
name = "rastro-ingestao"
version = "0.0.0"
description = "Rastro — módulo ingestao: Baixa, valida e normaliza os lotes oficiais; guarda proveniência por registro; publica o lote de forma atômica."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rastro_ingestao"]
