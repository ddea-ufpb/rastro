[project]
name = "rastro-consulta"
version = "0.0.0"
description = "Rastro — módulo consulta: API e busca por município, parlamentar e função; agregações; contrato versionado."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rastro_consulta"]
