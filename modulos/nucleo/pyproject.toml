[project]
name = "rastro-nucleo"
version = "0.0.0"
description = "Rastro — módulo nucleo: Calcula a diferença entre lotes e o estado de execução consolidado de cada emenda."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rastro_nucleo"]
