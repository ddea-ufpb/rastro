[project]
name = "rastro-app"
version = "0.0.0"
description = "Rastro — compõe as rotas dos módulos num único FastAPI."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "rastro-ingestao",
    "rastro-nucleo",
    "rastro-consulta",
    "rastro-saida",
]

[tool.uv.sources]
rastro-ingestao = { workspace = true }
rastro-nucleo = { workspace = true }
rastro-consulta = { workspace = true }
rastro-saida = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rastro_app"]
