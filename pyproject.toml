[project]
name = "rastro-workspace"
version = "0.0.0"
description = "Rastro — raiz do workspace (não é pacote)."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.6",
    "import-linter>=2.1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["modulos/*", "app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web", "especificacoes"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["rastro_ingestao", "rastro_nucleo", "rastro_consulta", "rastro_saida", "rastro_app"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

[tool.coverage.run]
branch = true

[tool.importlinter]
root_packages = [
    "rastro_ingestao",
    "rastro_nucleo",
    "rastro_consulta",
    "rastro_saida",
    "rastro_app",
]

[[tool.importlinter.contracts]]
name = "Os quatro módulos são independentes entre si"
type = "independence"
modules = ["rastro_ingestao", "rastro_nucleo", "rastro_consulta", "rastro_saida"]

[[tool.importlinter.contracts]]
name = "O app fica acima dos módulos"
type = "layers"
layers = [
    "rastro_app",
    "rastro_ingestao | rastro_nucleo | rastro_consulta | rastro_saida",
]
